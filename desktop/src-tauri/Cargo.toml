[package]
name = "valea"
version = "0.3.1"
description = "valea desktop"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"
# Two [[bin]] targets exist since the valea-spawn shim (windows spec B2), and
# `tauri dev`'s bare `cargo run` needs exactly one default — without this,
# `just dev-desktop` dies with "could not determine which binary to run".
default-run = "valea"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

# windows-support spec B2: the agent-spawn shim. Declared rather than inferred
# so the bin is named `valea-spawn`, not `valea_spawn` — the Justfile and
# Tauri's externalBin layout both key off the hyphenated name. The main `valea`
# bin stays inferred from src/main.rs. Bundled only on Windows
# (tauri.windows.conf.json); elsewhere it compiles to a stub so `cargo check`
# stays green on every host.
[[bin]]
name = "valea-spawn"
path = "src/bin/valea_spawn.rs"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# New-mail notifications (mail full-client plan, M5 task 13). The SPA drives
# it entirely through the plugin's own JS API (frontend/src/lib/notify.ts) —
# there is no `#[tauri::command]` of ours behind it, so the only wiring is the
# `.plugin(...)` registration in main.rs plus capabilities/notifications.json.
tauri-plugin-notification = "2"
# Reveal-in-file-manager for tree rows (file tree & composer pass). Only the
# `reveal_item_in_dir` half is permitted — see capabilities/default.json — so
# the plugin's URL opener stays unreachable and links.rs remains the single
# door to the user's browser.
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

# Job Objects for the sidecar (spec E1) and for valea-spawn (spec B2). Pinned
# to the version tauri already locks so the tree builds one `windows` crate.
#
# Win32_Security is NOT optional here despite nothing in our code naming a
# security type: `CreateJobObjectW` takes `Option<*const SECURITY_ATTRIBUTES>`
# and is itself `#[cfg(feature = "Win32_Security")]`, so without it the
# function simply does not exist. Win32_System_Threading likewise gates
# `JOBOBJECT_EXTENDED_LIMIT_INFORMATION` (it embeds IO_COUNTERS) on top of
# providing OpenProcess.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }
