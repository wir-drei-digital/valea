# Windows bring-up lane (windows-support spec T1/F). Dispatch-only on
# purpose: main must not ship a release lane that produces broken
# installers. Task 8 retires this file into the release.yml matrix.
name: Windows bring-up
on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict
      - uses: actions/cache@v4
        with:
          path: |
            backend/deps
            backend/_build
          key: mix-prod-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.tool-versions', 'backend/mix.lock') }}
      - uses: actions/cache@v4
        with:
          path: ~/.local/zig
          key: zig-0.15.2-${{ runner.os }}-${{ runner.arch }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Install JS deps
        run: |
          (cd frontend && bun install --frozen-lockfile)
          (cd desktop && bun install --frozen-lockfile)
      - name: Bootstrap hex/rebar
        run: cd backend && mix local.hex --force && mix local.rebar --force
      # mix test does NOT auto-fetch — without this a cold runner dies with
      # "missing dependencies" before the suite even starts.
      - name: Fetch backend deps
        run: cd backend && mix deps.get
      # Spec §D testing split: the platform-aware Valea.Paths walk touches OTP
      # path functions and the real filesystem, so its Windows semantics
      # (root-floor, UNC roots, case-folded containment) must be proven on the
      # native lane, not just the pure suite on Unix. GATING — Task 3 is not
      # complete until this is green.
      #
      # Task 4 (spec §D4) rewired every absoluteness/ancestry gate onto that
      # API, so its own guard (paths_boundary_test) AND the suites of the
      # migrated modules run here too — the containment decisions those suites
      # exercise are exactly what changed shape.
      - name: Paths containment suite (gating)
        run: |
          cd backend && mix test \
            test/valea/paths_test.exs \
            test/valea/paths_boundary_test.exs \
            test/valea/mounts/mounts_test.exs \
            test/valea/mounts/mounts_mutation_test.exs \
            test/valea/agents/permission_policy_test.exs \
            test/valea/icm_test.exs \
            test/valea/icm_symlink_containment_test.exs \
            test/valea_web/icm_rpc_test.exs \
            test/valea/calendar/local_test.exs \
            test/valea_web/files_controller_test.exs
      # Also builds and stages `valea-spawn.exe` (spec B2) — which is why the
      # full suite runs AFTER it: on Windows the process adapter is `PortShim`,
      # and it refuses to spawn without the shim (never a silent Port-only
      # fallback). A bare `cargo build --bin valea-spawn` here would not do:
      # tauri-build's externalBin check runs on every build of that package and
      # fails until BOTH binaries are staged, which is the dance this recipe
      # already owns.
      - name: Build SPA + Burrito sidecar (+ spawn shim)
        env:
          BURRITO_TARGET: windows_x64
        run: just package-backend
      # GATING since Task 6: paths (T3/T4) plus the platform fixtures and the
      # Port adapter (T6) are what make the whole suite runnable here, so a red
      # run is a Windows regression, not a survey finding. VALEA_SPAWN_SHIM
      # points at the STAGED shim — the exact file the installer ships, not a
      # side build of it.
      - name: Backend suite (gating)
        env:
          VALEA_SPAWN_SHIM: '${{ github.workspace }}\desktop\src-tauri\binaries\valea-spawn-x86_64-pc-windows-msvc.exe'
        run: cd backend && mix test 2>&1 | tee ../windows-test-run.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-test-run
          path: windows-test-run.txt
      - name: Build NSIS bundle (no release)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: windows-bundles
          retention-days: 7
          if-no-files-found: error
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/nsis/*.exe.sig
      # Spec B2: the valea-spawn contract (tree kill on stdin EOF, capped
      # stderr file, exit-code mirror, COMSPEC quoting for .cmd targets) is
      # Job-Object and cmd.exe behaviour — it does not exist to be tested
      # anywhere but here. GATING: Task 5 is not complete until this is green.
      # Runs after the artifact upload so a shim regression still leaves the
      # bundle available for inspection.
      - name: valea-spawn shim suite (gating)
        run: cd desktop/src-tauri && cargo test --release --test spawn_shim
